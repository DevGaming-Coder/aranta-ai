<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aranta AI - Professional AI Workspace</title>
    <!-- Marked.js for Rendering Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        
        :root {
            --bg-dark: #0f172a;
            --container-bg: #1e293b;
            --header-bg: #334155;
            --user-msg: #2563eb;
            --bot-msg: #334155;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --font-size-base: 0.95rem;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            min-height: 100vh; 
            padding: 10px;
        }

        /* Layout Structure */
        .app-wrapper {
            display: flex;
            width: 100%;
            max-width: 1100px;
            height: calc(100vh - 70px);
            background: var(--container-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* Sidebar Drawer */
        .sidebar {
            width: 260px;
            background: #0f172a;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            background: var(--user-msg);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background: #1d4ed8; }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .session-item:hover, .session-item.active {
            background: var(--header-bg);
            color: var(--text-main);
        }

        /* Main Workspace */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Header Bar */
        .header {
            background: var(--header-bg);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-blue);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select.persona-select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }

        .icon-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 1.1rem;
            padding: 6px;
            cursor: pointer;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

        /* Messages Window */
        .messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }
        .msg-wrapper.user { align-self: flex-end; }
        .msg-wrapper.bot { align-self: flex-start; }

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: var(--font-size-base);
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        .user .msg {
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .msg {
            background: var(--bot-msg);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        /* Formatting Code & Tables */
        .bot p { margin-bottom: 8px; }
        .bot p:last-child { margin-bottom: 0; }
        .bot ul, .bot ol { margin-left: 20px; margin-bottom: 8px; }
        .bot code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.9em; }
        
        .code-block-wrapper {
            position: relative;
            margin: 8px 0;
            background: #090d16;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .code-header {
            background: #1e293b;
            padding: 4px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .code-block-wrapper pre {
            padding: 12px;
            overflow-x: auto;
            color: #e2e8f0;
            margin: 0;
        }

        .msg-toolbar {
            display: flex;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            align-items: center;
        }

        /* Categorized Suggestion Chips */
        .chips-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 16px;
            background: #172131;
            border-top: 1px solid var(--border-color);
            scrollbar-width: thin;
        }
        .chip {
            background: #334155;
            color: var(--accent-blue);
            border: 1px solid #0284c7;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip:hover { background: var(--accent-hover); color: white; }

        /* Input Controls Area */
        .input-section {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: white;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 140px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        textarea:focus { border-color: var(--accent-blue); }

        .send-btn {
            background: var(--user-msg);
            color: white;
            border: none;
            padding: 0 18px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .send-btn:hover { background: #1d4ed8; }

        .input-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 4px;
        }

        /* Settings Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: var(--container-bg);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent-blue);
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        /* Thinking animation */
        .dots::after { content: ''; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

        /* Responsive UI Mobile Tweaks */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block !important; }
        }
        .mobile-toggle { display: none; }

        footer {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar / Drawer -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
        </div>
        <div class="session-list" id="sessionList">
            <!-- Dynamically populated sessions -->
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-chat">
        <!-- Top Navigation / Header -->
        <div class="header">
            <div class="brand-title">
                <button class="icon-btn mobile-toggle" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <span>✨ Aranta AI</span>
            </div>

            <div class="header-actions">
                <!-- System Tone Selector -->
                <select id="personaSelect" class="persona-select" onchange="updatePersona()">
                    <option value="Professional Assistant">Tone: Professional</option>
                    <option value="Code Expert">Tone: Developer</option>
                    <option value="Concise & Direct">Tone: Concise</option>
                    <option value="Creative Writer">Tone: Creative</option>
                </select>

                <!-- Action Options -->
                <button class="icon-btn" title="Export Markdown" onclick="exportChat('md')"><i class="fa-solid fa-file-export"></i></button>
                <button class="icon-btn" title="Clear Chat Window" onclick="clearCurrentChat()"><i class="fa-solid fa-trash-can"></i></button>
                <button class="icon-btn" title="Settings" onclick="toggleModal()"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <!-- Chat Log Window -->
        <div class="messages" id="messageBox">
            <div class="msg-wrapper bot">
                <div class="msg">Hello! I am **Aranta AI**. How can I help you today?</div>
                <div class="msg-toolbar">
                    <span class="time">Just now</span>
                </div>
            </div>
        </div>

        <!-- Categorized Prompt Chips Bar -->
        <div class="chips-bar" id="chipsBar">
            <div class="chip" onclick="quickSend('Write a Python function for sorting an array')"><i class="fa-solid fa-code"></i> Python Sort</div>
            <div class="chip" onclick="quickSend('Explain Quantum Computing in simple terms')"><i class="fa-solid fa-brain"></i> Explain Quantum</div>
            <div class="chip" onclick="quickSend('Draft a professional email to request project status')"><i class="fa-solid fa-envelope"></i> Draft Status Email</div>
            <div class="chip" onclick="quickSend('Summarize key benefits of microservices architecture')"><i class="fa-solid fa-list-check"></i> Microservices</div>
            <div class="chip" onclick="quickSend('Help me debug an error in JS async fetch')"><i class="fa-solid fa-bug"></i> Debug JS Fetch</div>
        </div>

        <!-- Interactive Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ask Aranta anything... (Shift+Enter for new line)" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
            <div class="input-meta">
                <span id="charCounter">0 characters | 0 words</span>
                <span>Press Enter to send</span>
            </div>
        </div>
    </div>
</div>

<!-- Settings Modal Overlay -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <span>Preferences</span>
            <button class="icon-btn" onclick="toggleModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="setting-row">
            <span>Font Size</span>
            <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                <option value="0.85rem">Small</option>
                <option value="0.95rem" selected>Default</option>
                <option value="1.05rem">Large</option>
            </select>
        </div>
        <div class="setting-row">
            <span>Auto-Scroll</span>
            <input type="checkbox" id="autoScrollCheck" checked>
        </div>
    </div>
</div>

<footer>
    © 2026 Aranta AI. All Rights Reserved.
</footer>

<script>
    // System State Variables
    let currentSessionId = Date.now().toString();
    let conversationHistory = [];
    let currentPersona = "Professional Assistant";

    // Startup Initialization
    window.onload = function() {
        loadSessionsFromStorage();
        setupInputCounter();
    };

    // Auto-resizing Input Area
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight < 140 ? textarea.scrollHeight : 140) + 'px';
        updateCounters(textarea.value);
    }

    function updateCounters(text) {
        const charCount = text.length;
        const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById("charCounter").textContent = `${charCount} characters | ${wordCount} words`;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMsg();
        }
    }

    function updatePersona() {
        currentPersona = document.getElementById("personaSelect").value;
    }

    // Main API Handler
    async function sendMsg() {
        const input = document.getElementById("userInput");
        const box = document.getElementById("messageBox");
        const text = input.value.trim();
        if (!text) return;

        // Hide prompt chips after interaction
        document.getElementById("chipsBar").style.display = "none";

        // Append User Message to UI & History
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        appendMessage('user', text, timestamp);
        conversationHistory.push({ role: 'user', content: text });

        // Reset Input State
        input.value = "";
        autoResize(input);

        // Append Temporary Bot Thinking Block
        const botWrapper = document.createElement("div");
        botWrapper.className = "msg-wrapper bot";
        const botDiv = document.createElement("div");
        botDiv.className = "msg";
        botDiv.innerHTML = '<span class="dots">Thinking</span>';
        botWrapper.appendChild(botDiv);
        box.appendChild(botWrapper);
        scrollBox();

        try {
            // Send payload with multi-turn conversation context
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: text,
                    history: conversationHistory.slice(-6), // Send recent turns for memory
                    persona: currentPersona
                })
            });

            const data = await res.json();
            
            if (data.reply) {
                const replyText = data.reply;
                botDiv.innerHTML = marked.parse(replyText);
                conversationHistory.push({ role: 'model', content: replyText });
                
                // Add Quick Toolbar (TTS & Copy)
                attachBotToolbar(botWrapper, replyText);
                formatCodeBlocks(botDiv);
                saveSessionToStorage();
            } else {
                botDiv.textContent = data.error || "Server error occurred.";
            }
        } catch (e) {
            botDiv.style.color = "#ef4444";
            botDiv.textContent = "Error connecting to server. Please ensure server.py is live.";
        }
        scrollBox();
    }

    function appendMessage(role, text, time) {
        const box = document.getElementById("messageBox");
        const wrapper = document.createElement("div");
        wrapper.className = `msg-wrapper ${role}`;

        const msgDiv = document.createElement("div");
        msgDiv.className = "msg";
        msgDiv.innerHTML = role === 'bot' ? marked.parse(text) : text;
        wrapper.appendChild(msgDiv);

        const toolbar = document.createElement("div");
        toolbar.className = "msg-toolbar";
        toolbar.innerHTML = `<span>${time}</span>`;
        if (role === 'bot') {
            attachBotToolbar(wrapper, text);
            formatCodeBlocks(msgDiv);
        } else {
            wrapper.appendChild(toolbar);
        }

        box.appendChild(wrapper);
        scrollBox();
    }

    // Attach Interactive Bot Toolbar Options
    function attachBotToolbar(wrapper, rawText) {
        const toolbar = document.createElement("div");
        toolbar.className = "msg-toolbar";
        toolbar.innerHTML = `
            <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            <button class="icon-btn" title="Copy Message" onclick="copyToClipboard(\`${encodeURIComponent(rawText)}\`, this)"><i class="fa-regular fa-copy"></i></button>
            <button class="icon-btn" title="Read Aloud" onclick="speakText(\`${encodeURIComponent(rawText)}\`)"><i class="fa-solid fa-volume-high"></i></button>
        `;
        wrapper.appendChild(toolbar);
    }

    // Code Block Formatting with Copy Button
    function formatCodeBlocks(container) {
        container.querySelectorAll("pre code").forEach((codeBlock) => {
            if (codeBlock.parentElement.classList.contains("formatted")) return;
            
            const pre = codeBlock.parentElement;
            pre.classList.add("formatted");
            const wrapper = document.createElement("div");
            wrapper.className = "code-block-wrapper";

            const header = document.createElement("div");
            header.className = "code-header";
            header.innerHTML = `<span>Code Snippet</span><button class="icon-btn" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy</button>`;

            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(header);
            wrapper.appendChild(pre);
        });
    }

    // Utility Features: Copying & TTS
    function copyToClipboard(encodedText, btn) {
        const text = decodeURIComponent(encodedText);
        navigator.clipboard.writeText(text);
        btn.innerHTML = `<i class="fa-solid fa-check" style="color:#22c55e"></i>`;
        setTimeout(() => btn.innerHTML = `<i class="fa-regular fa-copy"></i>`, 2000);
    }

    function copyCode(btn) {
        const codeText = btn.closest(".code-block-wrapper").querySelector("pre code").innerText;
        navigator.clipboard.writeText(codeText);
        btn.innerHTML = `<i class="fa-solid fa-check" style="color:#22c55e"></i> Copied!`;
        setTimeout(() => btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`, 2000);
    }

    function speakText(encodedText) {
        const text = decodeURIComponent(encodedText);
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`]/g, ''));
        window.speechSynthesis.speak(utterance);
    }

    function quickSend(prompt) {
        document.getElementById("userInput").value = prompt;
        sendMsg();
    }

    function scrollBox() {
        if (document.getElementById("autoScrollCheck").checked) {
            const box = document.getElementById("messageBox");
            box.scrollTop = box.scrollHeight;
        }
    }

    // LocalStorage Session Persistence
    function saveSessionToStorage() {
        const sessions = JSON.parse(localStorage.getItem("aranta_sessions") || "{}");
        sessions[currentSessionId] = {
            id: currentSessionId,
            title: conversationHistory[0]?.content.substring(0, 25) || "New Conversation",
            history: conversationHistory,
            timestamp: Date.now()
        };
        localStorage.setItem("aranta_sessions", JSON.stringify(sessions));
        loadSessionsFromStorage();
    }

    function loadSessionsFromStorage() {
        const sessions = JSON.parse(localStorage.getItem("aranta_sessions") || "{}");
        const list = document.getElementById("sessionList");
        list.innerHTML = "";

        Object.values(sessions).reverse().forEach(session => {
            const item = document.createElement("div");
            item.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <span><i class="fa-regular fa-message"></i> ${session.title}...</span>
                <i class="fa-solid fa-xmark" onclick="deleteSession(event, '${session.id}')"></i>
            `;
            item.onclick = (e) => {
                if (e.target.classList.contains("fa-xmark")) return;
                loadSession(session.id);
            };
            list.appendChild(item);
        });
    }

    function loadSession(id) {
        const sessions = JSON.parse(localStorage.getItem("aranta_sessions") || "{}");
        if (!sessions[id]) return;
        currentSessionId = id;
        conversationHistory = sessions[id].history;
        
        const box = document.getElementById("messageBox");
        box.innerHTML = "";
        conversationHistory.forEach(msg => {
            appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content, 'Saved');
        });
        loadSessionsFromStorage();
    }

    function startNewChat() {
        currentSessionId = Date.now().toString();
        conversationHistory = [];
        document.getElementById("messageBox").innerHTML = `
            <div class="msg-wrapper bot">
                <div class="msg">Hello! I am **Aranta AI**. How can I assist you today?</div>
            </div>`;
        document.getElementById("chipsBar").style.display = "flex";
        loadSessionsFromStorage();
    }

    function clearCurrentChat() {
        conversationHistory = [];
        document.getElementById("messageBox").innerHTML = '<div class="msg-wrapper bot"><div class="msg">Chat cleared. Ask me anything!</div></div>';
    }

    function deleteSession(e, id) {
        e.stopPropagation();
        const sessions = JSON.parse(localStorage.getItem("aranta_sessions") || "{}");
        delete sessions[id];
        localStorage.setItem("aranta_sessions", JSON.stringify(sessions));
        if (id === currentSessionId) startNewChat();
        else loadSessionsFromStorage();
    }

    function exportChat(format) {
        const text = conversationHistory.map(m => `### ${m.role.toUpperCase()}\n${m.content}\n`).join('\n');
        const blob = new Blob([text], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Aranta_Chat_${currentSessionId}.md`;
        a.click();
    }

    // Modal & Mobile Helpers
    function toggleModal() {
        const modal = document.getElementById("settingsModal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function changeFontSize(size) {
        document.documentElement.style.setProperty('--font-size-base', size);
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }
</script>
</body>
</html>
