<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aranta AI</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 600px; background: #1e293b; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { background: #334155; padding: 16px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #475569; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
        .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 12px; background: #0f172a; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        button { background: #2563eb; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">✨ Aranta AI Assistant</div>
    <div class="messages" id="messageBox">
        <div class="msg bot">Hello! I'm Aranta. How can I assist you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Aranta anything..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
    async function sendMsg() {
        const input = document.getElementById("userInput");
        const box = document.getElementById("messageBox");
        const text = input.value.trim();
        if (!text) return;

        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            box.innerHTML += `<div class="msg bot">${data.reply || data.error}</div>`;
        } catch (e) {
            box.innerHTML += `<div class="msg bot" style="color:#ef4444">Error connecting to server. Make sure server.py is running!</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
