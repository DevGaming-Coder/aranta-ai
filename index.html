    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 0; }
        .chat-container { width: 100%; max-width: 450px; height: 600px; background: #1e293b; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        .clear-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: normal; }

        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .bot p { margin-bottom: 8px; }
        .bot p:last-child { margin-bottom: 0; }
        .bot ul, .bot ol { margin-left: 20px; margin-bottom: 8px; }
        .bot code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        
        /* Suggestion Chips */
        .chips-container { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: #1e293b; border-top: 1px solid #334155; }

        .chip:hover { background: #0284c7; color: white; }
